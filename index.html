<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Hello, Lexi </h1>
            <div class="nav">
                <span class="navigation"></span>
                <span class="material-symbols-outlined"> search </span>
                <input type="text" placeholder="What do you want to play?">
            </div>
        </div>
        <div class="list">
            <ul>
                <li><span class="material-symbols-outlined"> person </span>profile</li>
                <li><span class="material-symbols-outlined"> inbox </span>messages</li>
                <li><span class="material-symbols-outlined"> trending_up </span>listening stats</li>
                <li><span class="material-symbols-outlined"> contact_support </span>support</li>
                <li><span class="material-symbols-outlined"> lock </span>privacy</li>
            </ul>
            </div>
        
        
        <div class="tiles">
            <table >
                <tr>Library</tr>
                <tr>
                    <td><img src="album 1.jpeg" alt="playlist 1">Spacey</td>
                    <td><img src="album 4.jpg" alt="playlist 4">Touse</td>
                    <td><img src="album 3.jpeg" alt="playlist 3">Throwbacks</td>
                </tr>
                <tr>
                    <td><img src="album 2.jpeg" alt="playlist 2">Sunday;)</td>
                    <td><img src="album 5.jpg" alt="playlist 5">Vibe</td>
                    <td><img src="album 6.jpg" alt="playlist 6">Texan</td>
                </tr>
            </table>
            </div>
        <div class="discover">discover
            recents
            podcasts
        </div>
        <div class="footer">footer</footer></div>
    </div>
</body>
</html>
